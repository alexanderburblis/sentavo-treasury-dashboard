name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: SQL checks (DuckDB views, data-quality checks, README figures)
        run: python src/run_sql_checks.py

      - name: pandas reconciliation
        run: python src/reconcile_dashboard.py data

      - name: Tests (SQL vs pandas vs README figures, data rules)
        run: pytest -q
